# Builds the debug APK on every push to main (or by hand: Actions tab -> Build APK -> Run workflow) and puts it on
# the rolling "latest" release, so the download link never changes:
#   https://github.com/<owner>/<repo>/releases/download/latest/<APK_NAME>
# Keep this file's name: GitHub numbers runs per workflow file, and the run number is the app's versionCode.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs of the same branch go one at a time, oldest first, so an older build can never replace a newer APK.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The file name people download. A new app made from this template sets its own (see AGENTS.md).
  APK_NAME: forge-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle and its cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # the open-source cache, free for public and private repos

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_NAME }}
          archive: false # a plain .apk, not a zip
          if-no-files-found: error

  publish:
    # Only builds of main reach the release; a manual run on another branch just keeps its artifact.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to move the tag and replace the release's APK
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the APK from the build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APK_NAME }}

      - name: Point the "latest" tag at this commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/latest" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" --silent
          fi

      - name: Put the APK on the "latest" release
        run: |
          url="https://github.com/$GH_REPO/releases/download/latest/$APK_NAME"
          title="Latest build (#$GITHUB_RUN_NUMBER)"
          notes="Debug build #$GITHUB_RUN_NUMBER, from commit ${GITHUB_SHA::7}. To install, open this link on your phone: $url"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_NAME" --clobber
            gh release edit latest --title "$title" --notes "$notes" --latest
            # Remove APKs left under an older name, e.g. Forge's after a new app made from the template renamed its APK.
            for old in $(gh release view latest --json assets -q '.assets[].name'); do
              [ "$old" = "$APK_NAME" ] || gh release delete-asset latest "$old" --yes
            done
          else
            gh release create latest "$APK_NAME" --title "$title" --notes "$notes" --latest
          fi
          echo "Download: $url" >> "$GITHUB_STEP_SUMMARY"
